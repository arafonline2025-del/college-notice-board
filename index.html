<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hazrat Shah Ali Mohila College</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

html,
body{
    width:100%;
    height:100%;
}


body{

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        180deg,
        #065f46 0%,
        #00112b 25%,
        #000814 100%
    );

    color:white;

    display:flex;

    flex-direction:column;

    overflow:hidden;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    flex-shrink:0;

    background:
    linear-gradient(
        90deg,
        #065f46,
        #047857,
        #065f46
    );

    padding:18px 10px;

    border-bottom:3px solid #d4af37;

}


.college-top{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;

    flex-wrap:wrap;

}


.college-logo{

    width:95px;

    height:95px;

    object-fit:contain;

    background:white;

    border-radius:50%;

    padding:4px;

    box-shadow:
    0 0 14px rgba(255,255,255,.45);

}


.college-text{

    text-align:left;

}


.college-text h1{

    font-size:48px;

    font-weight:800;

    line-height:1.05;

}


.college-text h2{

    font-size:20px;

    letter-spacing:5px;

    margin-top:8px;

    font-weight:700;

}


/* =====================================================
   NOTICE AREA
===================================================== */

.notice-box{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding:8px 18px 18px;

    min-height:0;

}


/* =====================================================
   NOTICE LAYOUT
===================================================== */

.notice-layout{

    width:96%;

    max-width:1500px;

    display:flex;

    gap:18px;

    align-items:flex-start;

    margin-top:0;

}


/* =====================================================
   NOTICE CARD
===================================================== */

.notice-card{

    flex:1;

    background:
    rgba(0,10,40,.92);

    border:
    2px solid rgba(255,255,255,.14);

    border-radius:28px;

    padding:
    25px 34px 30px;

    text-align:center;

    box-shadow:
    0 0 36px rgba(0,0,0,.5);

}


/* =====================================================
   NOTICE BADGE
===================================================== */

.badge{

    display:inline-block;

    background:
    linear-gradient(
        90deg,
        #f59e0b,
        #facc15
    );

    color:#111827;

    font-weight:800;

    font-size:28px;

    padding:
    14px 34px;

    border-radius:999px;

    margin-bottom:12px;

    box-shadow:
    0 0 20px rgba(250,204,21,.45);

}


/* =====================================================
   NOTICE HEADING
===================================================== */

#notice-heading{

    font-size:52px;

    font-weight:800;

    color:#facc15;

    margin:
    0 auto 14px;

    line-height:1.18;

    text-shadow:
    0 2px 10px rgba(0,0,0,.5);

    max-width:1150px;

    overflow-wrap:anywhere;

}


/* =====================================================
   NOTICE TEXT
===================================================== */

#notice{

    font-size:30px;

    line-height:1.7;

    font-weight:600;

    text-align:center;

    background:
    rgba(255,255,255,.06);

    border:
    2px solid rgba(255,255,255,.16);

    border-radius:22px;

    padding:
    25px 34px;

    max-width:1050px;

    margin:
    0 auto 20px;

    color:#f8fafc;

    min-height:160px;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
    inset 0 0 12px
    rgba(255,255,255,.04);

    overflow-wrap:anywhere;

}


/* =====================================================
   DATE
===================================================== */

#date{

    font-size:27px;

    color:#d9f99d;

    font-weight:700;

    margin-top:5px;

}


/* =====================================================
   RIGHT PROFILE PANEL
===================================================== */

.profile-panel{

    width:250px;

    flex-shrink:0;

    display:flex;

    flex-direction:column;

    gap:15px;

}


/* =====================================================
   PROFILE CARD
===================================================== */

.profile-card{

    background:
    rgba(0,10,40,.94);

    border:
    2px solid #d4af37;

    border-radius:20px;

    overflow:hidden;

    text-align:center;

    box-shadow:
    0 0 20px rgba(0,0,0,.5);

}


/* =====================================================
   PROFILE IMAGE
===================================================== */

.profile-card img{

    width:100%;

    height:180px;

    object-fit:cover;

    display:block;

}


/* =====================================================
   PROFILE INFO
===================================================== */

.profile-info{

    padding:
    10px 8px 12px;

}


.profile-name{

    font-size:20px;

    font-weight:800;

    color:#facc15;

    line-height:1.3;

}


.profile-title{

    font-size:17px;

    font-weight:600;

    color:white;

    margin-top:5px;

    line-height:1.4;

}


.profile-phone{

    font-size:16px;

    color:#d9f99d;

    margin-top:5px;

    font-weight:700;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    flex-shrink:0;

    background:#00112b;

    border-top:
    2px solid #d4af37;

    padding:
    14px 22px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:20px;

    font-weight:600;

}


/* =====================================================
   BOTTOM
===================================================== */

.bottom{

    flex-shrink:0;

    background:#065f46;

    padding:12px;

    text-align:center;

    font-size:24px;

    font-weight:700;

    border-top:
    2px solid #d4af37;

    letter-spacing:.5px;

}


/* =====================================================
   TV 16:9 OPTIMIZATION
===================================================== */

@media(min-width:769px) and (max-height:900px){

    .header{

        padding:12px 10px;

    }


    .college-logo{

        width:75px;

        height:75px;

    }


    .college-text h1{

        font-size:38px;

    }


    .college-text h2{

        font-size:17px;

        margin-top:5px;

    }


    .notice-box{

        padding:
        8px 18px 12px;

    }


    .notice-card{

        padding:
        18px 28px 22px;

    }


    .badge{

        font-size:23px;

        padding:
        10px 28px;

        margin-bottom:10px;

    }


    #notice-heading{

        font-size:44px;

        margin-bottom:10px;

    }


    #notice{

        font-size:25px;

        line-height:1.6;

        min-height:130px;

        padding:
        20px 28px;

        margin-bottom:12px;

    }


    #date{

        font-size:22px;

    }


    .profile-panel{

        gap:12px;

    }


    .profile-card img{

        height:145px;

    }


    .profile-info{

        padding:
        7px 6px 9px;

    }


    .profile-name{

        font-size:18px;

    }


    .profile-title{

        font-size:15px;

    }


    .profile-phone{

        font-size:14px;

    }


    .footer{

        padding:
        9px 18px;

        font-size:17px;

    }


    .bottom{

        padding:8px;

        font-size:20px;

    }

}


/* =====================================================
   VERY SHORT TV SCREEN
===================================================== */

@media(min-width:769px) and (max-height:700px){

    .header{

        padding:8px;

    }


    .college-logo{

        width:60px;

        height:60px;

    }


    .college-text h1{

        font-size:30px;

    }


    .college-text h2{

        font-size:13px;

        letter-spacing:3px;

    }


    .notice-box{

        padding:
        5px 12px 8px;

    }


    .notice-layout{

        gap:12px;

    }


    .notice-card{

        padding:
        12px 20px 15px;

    }


    .badge{

        font-size:18px;

        padding:
        7px 20px;

        margin-bottom:7px;

    }


    #notice-heading{

        font-size:34px;

        margin-bottom:7px;

    }


    #notice{

        font-size:21px;

        line-height:1.5;

        min-height:95px;

        padding:
        12px 18px;

        margin-bottom:8px;

    }


    #date{

        font-size:18px;

    }


    .profile-panel{

        width:220px;

        gap:8px;

    }


    .profile-card img{

        height:105px;

    }


    .profile-info{

        padding:
        5px;

    }


    .profile-name{

        font-size:15px;

    }


    .profile-title{

        font-size:13px;

    }


    .profile-phone{

        font-size:12px;

    }


    .footer{

        padding:
        6px 12px;

        font-size:14px;

    }


    .bottom{

        padding:5px;

        font-size:16px;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:768px){

    body{

        overflow:auto;

    }


    .header{

        padding:
        15px 10px;

    }


    .college-top{

        flex-direction:column;

        gap:10px;

    }


    .college-logo{

        width:75px;

        height:75px;

    }


    .college-text{

        text-align:center;

    }


    .college-text h1{

        font-size:30px;

    }


    .college-text h2{

        font-size:14px;

        letter-spacing:2px;

    }


    .notice-box{

        padding:
        12px;

    }


    .notice-layout{

        width:100%;

        flex-direction:column;

    }


    .notice-card{

        width:100%;

        padding:
        20px 16px 28px;

    }


    .badge{

        font-size:20px;

        padding:
        10px 22px;

        margin-bottom:12px;

    }


    #notice-heading{

        font-size:30px;

        margin-bottom:10px;

    }


    #notice{

        font-size:20px;

        line-height:1.7;

        padding:18px;

        min-height:120px;

    }


    #date{

        font-size:20px;

    }


    .profile-panel{

        width:100%;

        flex-direction:row;

    }


    .profile-card{

        flex:1;

    }


    .profile-card img{

        height:150px;

    }


    .profile-name{

        font-size:16px;

    }


    .profile-title{

        font-size:14px;

    }


    .profile-phone{

        font-size:13px;

    }


    .footer{

        flex-direction:column;

        gap:8px;

        font-size:16px;

        text-align:center;

    }


    .bottom{

        font-size:18px;

    }

}

</style>

</head>


<body>

        Hazrat Shah Ali Mohila College

<!-- =====================================================
     BOTTOM
===================================================== -->

<div class="bottom">

    শিক্ষাই আলো, শিক্ষাই শক্তি

</div>



<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbyM6nadpOV1SDPbpv3wUmifIIQ7AaiCJT4yq3O24mR3OjI1LAiF1exV_1mD6sMA2Vdj/exec';



/* =====================================================
   VARIABLES
===================================================== */

let notices = [];

let current = 0;

let noticeTimer = null;

let lastNoticeData = '';



/* =====================================================
   LOAD NOTICES
===================================================== */

function loadNotices(){


    const callbackName =
    'showNotices_' + Date.now();


    window[callbackName] =
    function(data){


        try{


            const newNotices =
            Array.isArray(data)
            ? data
            : [];


            const newData =
            JSON.stringify(newNotices);


            /*
             * যদি Google Sheet-এর data
             * পরিবর্তন না হয় তাহলে
             * slideshow reset হবে না।
             */

            if(newData === lastNoticeData){

                return;

            }


            lastNoticeData =
            newData;


            notices =
            newNotices;


            /* =============================================
               NO NOTICE
            ============================================= */

            if(notices.length === 0){


                if(noticeTimer){

                    clearTimeout(
                        noticeTimer
                    );

                    noticeTimer = null;

                }


                document
                .getElementById(
                    'notice-heading'
                )
                .innerText =
                'নোটিশ নেই';


                document
                .getElementById(
                    'notice'
                )
                .innerText =
                'বর্তমানে কোনো নতুন নোটিশ নেই';


                document
                .getElementById(
                    'date'
                )
                .innerText =
                '';


                return;

            }


            /* =============================================
               CURRENT INDEX
            ============================================= */

            if(current >= notices.length){

                current = 0;

            }


            showNotice();


        }

        catch(error){

            console.error(
                'Notice Error:',
                error
            );

        }


        finally{


            try{

                delete window[callbackName];

            }

            catch(e){}

        }

    };



    /* =================================================
       REMOVE OLD SCRIPT
    ================================================= */

    const oldScript =
    document.getElementById(
        'noticeScript'
    );


    if(oldScript){

        oldScript.remove();

    }



    /* =================================================
       CREATE JSONP SCRIPT
    ================================================= */

    const script =
    document.createElement(
        'script'
    );


    script.id =
    'noticeScript';


    script.src =
    API_URL +
    '?callback=' +
    callbackName +
    '&t=' +
    Date.now();



    /* =================================================
       ERROR
    ================================================= */

    script.onerror =
    function(){


        /*
         * Internet temporarily unavailable হলে
         * পুরোনো notice মুছে যাবে না।
         */

        if(notices.length === 0){


            document
            .getElementById(
                'notice-heading'
            )
            .innerText =
            'সংযোগ সমস্যা';


            document
            .getElementById(
                'notice'
            )
            .innerText =
            'নোটিশ লোড করা যাচ্ছে না';


            document
            .getElementById(
                'date'
            )
            .innerText =
            'ইন্টারনেট সংযোগ পরীক্ষা করুন';

        }

    };


    document.body.appendChild(
        script
    );

}



/* =====================================================
   AUTO HEADING SIZE
===================================================== */

function adjustHeadingSize(){


    const heading =
    document.getElementById(
        'notice-heading'
    );


    const length =
    heading.innerText
    .trim()
    .length;



    if(length <= 20){

        heading.style.fontSize =
        '52px';

    }

    else if(length <= 35){

        heading.style.fontSize =
        '46px';

    }

    else if(length <= 50){

        heading.style.fontSize =
        '40px';

    }

    else if(length <= 70){

        heading.style.fontSize =
        '34px';

    }

    else{

        heading.style.fontSize =
        '30px';

    }



    /* MOBILE */

    if(window.innerWidth <= 768){


        if(length <= 30){

            heading.style.fontSize =
            '30px';

        }

        else if(length <= 60){

            heading.style.fontSize =
            '26px';

        }

        else{

            heading.style.fontSize =
            '22px';

        }

    }

}



/* =====================================================
   SHOW NOTICE
===================================================== */

function showNotice(){


    if(notices.length === 0){

        return;

    }


    const item =
    notices[current] || {};



    /* =================================================
       HEADING
    ================================================= */

    const heading =
    document.getElementById(
        'notice-heading'
    );


    heading.innerText =
    item.heading || '';


    adjustHeadingSize();



    /* =================================================
       NOTICE
    ================================================= */

    const paragraph =
    document.getElementById(
        'notice'
    );


    paragraph.innerText =
    item.notice || '';



    /* =================================================
       DATE
    ================================================= */

    const dateElement =
    document.getElementById(
        'date'
    );


    if(item.date){


        const d =
        new Date(item.date);


        if(!isNaN(d.getTime())){


            dateElement.innerText =
            '📅 তারিখ: ' +

            d.toLocaleDateString(
                'bn-BD',
                {

                    day:'numeric',

                    month:'long',

                    year:'numeric'

                }
            );

        }

        else{


            dateElement.innerText =
            '📅 তারিখ: ' +

            item.date;

        }

    }

    else{

        dateElement.innerText =
        '';

    }



    /* =================================================
       AUTOMATIC READING TIME
    ================================================= */

    const text =
    (item.notice || '').trim();


    const headingText =
    (item.heading || '').trim();


    const totalCharacters =
    text.length +
    headingText.length;


    let seconds;



    if(totalCharacters <= 80){

        seconds = 5;

    }

    else if(totalCharacters <= 160){

        seconds = 8;

    }

    else if(totalCharacters <= 250){

        seconds = 12;

    }

    else if(totalCharacters <= 350){

        seconds = 16;

    }

    else if(totalCharacters <= 500){

        seconds = 20;

    }

    else if(totalCharacters <= 700){

        seconds = 25;

    }

    else{

        seconds = 30;

    }



    /* =================================================
       STOP OLD TIMER
    ================================================= */

    if(noticeTimer){

        clearTimeout(
            noticeTimer
        );

    }



    /* =================================================
       NEXT NOTICE
    ================================================= */

    noticeTimer =
    setTimeout(
        function(){


            if(notices.length > 1){


                current++;


                if(current >= notices.length){

                    current = 0;

                }


                showNotice();

            }


        },
        seconds * 1000
    );

}



/* =====================================================
   CLOCK
===================================================== */

function updateClock(){


    const now =
    new Date();



    /* TIME */

    document
    .getElementById(
        'clock'
    )
    .innerText =

    now.toLocaleTimeString(
        'bn-BD',
        {

            hour12:true

        }
    );



    /* DATE */

    document
    .getElementById(
        'today'
    )
    .innerText =

    now.toLocaleDateString(
        'bn-BD',
        {

            weekday:'long',

            day:'numeric',

            month:'long',

            year:'numeric'

        }
    );

}



/* =====================================================
   CLOCK START
===================================================== */

setInterval(
    updateClock,
    1000
);


updateClock();



/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    'resize',
    adjustHeadingSize
);



/* =====================================================
   FIRST LOAD
===================================================== */

loadNotices();



/* =====================================================
   CHECK GOOGLE SHEET
   EVERY 30 SECONDS
===================================================== */

setInterval(
    loadNotices,
    30000
);

</script>


</body>

</html>
