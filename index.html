<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbyM6nadpOV1SDPbpv3wUmifIIQ7AaiCJT4yq3O24mR3OjI1LAiF1exV_1mD6sMA2Vdj/exec";

let notices = [];
let current = 0;

function loadNotices() {

    const callbackName = "showNotices";

    window[callbackName] = function(data) {

        notices = data || [];

        if (notices.length === 0) {
            document.getElementById("notice").innerText =
                "বর্তমানে কোনো নতুন নোটিশ নেই";
            document.getElementById("date").innerText = "";
            return;
        }

        current = 0;
        showNotice();
    };

    const oldScript = document.getElementById("noticeScript");

    if (oldScript) {
        oldScript.remove();
    }

    const script = document.createElement("script");

    script.id = "noticeScript";

    script.src =
        API_URL +
        "?callback=" +
        callbackName +
        "&t=" +
        Date.now();

    script.onerror = function() {
        document.getElementById("notice").innerText =
            "Notice load করা যাচ্ছে না";

        document.getElementById("date").innerText =
            "Data connection পরীক্ষা করুন";
    };

    document.body.appendChild(script);
}

function showNotice() {

    if (notices.length === 0) return;

    const item = notices[current];

    document.getElementById("notice").innerText =
        item.notice;

    document.getElementById("date").innerText =
        "তারিখ: " + item.date;
}


/* প্রতি 10 সেকেন্ডে notice পরিবর্তন */
setInterval(function() {

    if (notices.length > 1) {

        current++;

        if (current >= notices.length) {
            current = 0;
        }

        showNotice();
    }

}, 10000);


/* প্রতি 30 সেকেন্ডে নতুন data check */
setInterval(loadNotices, 30000);


/* প্রথমবার load */
loadNotices();

</script>
