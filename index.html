<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hazrat Shah Ali Mohila College</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #06111d;
    color: white;
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    overflow: hidden;
}

.header {
    height: 22vh;
    background: linear-gradient(135deg, #006a4e, #00916b);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

.college {
    font-size: 4vw;
    font-weight: bold;
}

.subtitle {
    font-size: 2vw;
    margin-top: 12px;
}

.notice-area {
    height: 68vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px;
}

.notice-box {
    width: 90%;
}

.notice-title {
    color: #ffd700;
    font-size: 3vw;
    font-weight: bold;
    margin-bottom: 35px;
}

#notice {
    font-size: 4vw;
    line-height: 1.5;
    font-weight: bold;
}

#date {
    margin-top: 35px;
    font-size: 2vw;
    color: #b9c9d9;
}

.footer {
    height: 10vh;
    background: #020810;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5vw;
    color: #9fb0c0;
}
</style>
</head>

<body>

<div class="header">
    <div class="college">
        Hazrat Shah Ali Mohila College
    </div>

    <div class="subtitle">
        DIGITAL NOTICE BOARD
    </div>
</div>

<div class="notice-area">
    <div class="notice-box">

        <div class="notice-title">
            📢 NOTICE
        </div>

        <div id="notice">
            Notice loading...
        </div>

        <div id="date"></div>

    </div>
</div>

<div class="footer">
    Hazrat Shah Ali Mohila College
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyM6nadpOV1SDPbpv3wUmifIIQ7AaiCJT4yq3O24mR3OjI1LAiF1exV_1mD6sMA2Vdj/exec";

let notices = [];
let current = 0;
let scriptTag = null;

function loadNotices() {

    const callbackName =
        "noticeCallback_" + Date.now();

    window[callbackName] = function(data) {

        notices = data || [];

        if (notices.length === 0) {

            document.getElementById("notice").innerText =
                "বর্তমানে কোনো নতুন নোটিশ নেই";

            document.getElementById("date").innerText = "";

        } else {

            current = 0;
            showNotice();
        }

        delete window[callbackName];

        if (scriptTag) {
            scriptTag.remove();
            scriptTag = null;
        }
    };

    scriptTag = document.createElement("script");

    scriptTag.src =
        API_URL +
        "?callback=" +
        callbackName +
        "&t=" +
        Date.now();

    scriptTag.onerror = function() {

        document.getElementById("notice").innerText =
            "Notice load করা যাচ্ছে না";

        document.getElementById("date").innerText =
            "Internet connection পরীক্ষা করুন";

        delete window[callbackName];

        if (scriptTag) {
            scriptTag.remove();
            scriptTag = null;
        }
    };

    document.body.appendChild(scriptTag);
}

function showNotice() {

    if (notices.length === 0) return;

    const item = notices[current];

    document.getElementById("notice").innerText =
        item.notice;

    document.getElementById("date").innerText =
        "তারিখ: " + item.date;
}

setInterval(function() {

    if (notices.length > 1) {

        current++;

        if (current >= notices.length) {
            current = 0;
        }

        showNotice();
    }

}, 10000);

setInterval(function() {
    loadNotices();
}, 30000);

loadNotices();

</script>

</body>
</html>
