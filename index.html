<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hazrat Shah Ali Mohila College</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
height:100vh;
background:linear-gradient(180deg,#065f46 0%, #00112b 25%, #000814 100%);
color:white;
display:flex;
flex-direction:column;
}

.header{
background:linear-gradient(90deg,#065f46,#047857,#065f46);
padding:25px 10px;
text-align:center;
border-bottom:3px solid #d4af37;
}

.header h1{
font-size:56px;
font-weight:800;
}

.header h2{
font-size:22px;
letter-spacing:4px;
margin-top:10px;
}

.notice-box{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.notice-card{
width:95%;
max-width:1200px;
background:rgba(0,10,40,0.92);
border:2px solid rgba(255,255,255,0.2);
border-radius:24px;
padding:40px 30px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,0.45);
}

.badge{
display:inline-block;
background:linear-gradient(90deg,#f59e0b,#facc15);
color:#111827;
font-weight:800;
font-size:28px;
padding:14px 32px;
border-radius:999px;
margin-bottom:35px;
box-shadow:0 0 18px rgba(250,204,21,0.45);
}

#notice{
font-size:58px;
font-weight:800;
line-height:1.3;
min-height:140px;
margin-bottom:30px;
}

#date{
font-size:28px;
color:#a7f3d0;
}

.footer{
background:#00112b;
border-top:2px solid #d4af37;
padding:16px 24px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:20px;
}

.bottom{
background:#065f46;
padding:12px;
text-align:center;
font-size:24px;
font-weight:bold;
border-top:2px solid #d4af37;
}

@media (max-width:768px){

.header h1{
font-size:34px;
}

.header h2{
font-size:16px;
}

.badge{
font-size:20px;
padding:10px 20px;
}

#notice{
font-size:34px;
min-height:100px;
}

#date{
font-size:20px;
}

.footer{
flex-direction:column;
gap:8px;
font-size:16px;
text-align:center;
}

.bottom{
font-size:18px;
}
}
</style>
</head>

<body>

<div class="header">
<h1>Hazrat Shah Ali Mohila College</h1>
<h2>DIGITAL NOTICE BOARD</h2>
</div>

<div class="notice-box">
<div class="notice-card">

<div class="badge">📢 NOTICE</div>

<div id="notice">Loading notice...</div>

<div id="date"></div>

</div>
</div>

<div class="footer">
<div>🕒 <span id="clock">--:--:--</span></div>
<div>Hazrat Shah Ali Mohila College</div>
<div>📅 <span id="today">--</span></div>
</div>

<div class="bottom">
শিক্ষাই আলো, শিক্ষাই শক্তি ❤️
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbyM6nadpOV1SDPbpv3wUmifIIQ7AaiCJT4yq3O24mR3OjI1LAiF1exV_1mD6sMA2Vdj/exec';

let notices=[];
let current=0;

function loadNotices(){
const callbackName='showNotices';

window[callbackName]=function(data){
notices=data||[];

if(notices.length===0){
document.getElementById('notice').innerText='বর্তমানে কোনো নতুন নোটিশ নেই';
document.getElementById('date').innerText='';
return;
}

current=0;
showNotice();
};

const oldScript=document.getElementById('noticeScript');
if(oldScript) oldScript.remove();

const script=document.createElement('script');
script.id='noticeScript';
script.src=API_URL+'?callback='+callbackName+'&t='+Date.now();

document.body.appendChild(script);
}

function showNotice(){
const item=notices[current];
document.getElementById('notice').innerText=item.notice||'';
document.getElementById('date').innerText='📅 তারিখ: '+(item.date||'');
}

setInterval(function(){
if(notices.length>1){
current=(current+1)%notices.length;
showNotice();
}
},10000);

function updateClock(){
const now=new Date();
document.getElementById('clock').innerText=
now.toLocaleTimeString('en-US',{hour12:true});

document.getElementById('today').innerText=
now.toLocaleDateString('en-US',{
month:'long',
day:'numeric',
year:'numeric'
});
}

setInterval(updateClock,1000);
updateClock();

loadNotices();
</script>

</body>
</html>
