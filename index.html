<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hazrat Shah Ali Mohila College</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
background:linear-gradient(180deg,#065f46 0%, #00112b 25%, #000814 100%);
color:white;
display:flex;
flex-direction:column;
overflow:hidden;
}

.header{
background:linear-gradient(90deg,#065f46,#047857,#065f46);
padding:18px 10px;
border-bottom:3px solid #d4af37;
}

.college-top{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
flex-wrap:wrap;
}

.college-logo{
width:95px;
height:95px;
object-fit:contain;
background:white;
border-radius:50%;
padding:4px;
box-shadow:0 0 14px rgba(255,255,255,0.45);
}

.college-text{
text-align:left;
}

.college-text h1{
font-size:48px;
font-weight:800;
line-height:1.05;
}

.college-text h2{
font-size:20px;
letter-spacing:5px;
margin-top:8px;
font-weight:700;
}

.notice-box{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
}

.notice-card{
width:96%;
max-width:1300px;
background:rgba(0,10,40,0.92);
border:2px solid rgba(255,255,255,0.14);
border-radius:28px;
padding:28px 34px 34px;
text-align:center;
box-shadow:0 0 36px rgba(0,0,0,0.5);
}

.badge{
display:inline-block;
background:linear-gradient(90deg,#f59e0b,#facc15);
color:#111827;
font-weight:800;
font-size:28px;
padding:14px 34px;
border-radius:999px;
margin-bottom:18px;
box-shadow:0 0 20px rgba(250,204,21,0.45);
}

#notice-heading{
font-size:52px;
font-weight:800;
color:#facc15;
margin-top:-4px;
margin-bottom:16px;
line-height:1.2;
text-shadow:0 2px 10px rgba(0,0,0,0.5);
}

#notice{
font-size:30px;
line-height:1.8;
font-weight:600;
text-align:center;
background:rgba(255,255,255,0.06);
border:2px solid rgba(255,255,255,0.16);
border-radius:22px;
padding:26px 34px;
max-width:980px;
margin:0 auto 22px auto;
color:#f8fafc;
box-shadow:inset 0 0 12px rgba(255,255,255,0.04);
min-height:170px;
display:flex;
align-items:center;
justify-content:center;
}

#date{
font-size:28px;
color:#d9f99d;
font-weight:700;
margin-top:6px;
}

.footer{
background:#00112b;
border-top:2px solid #d4af37;
padding:14px 22px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:20px;
font-weight:600;
}

.bottom{
background:#065f46;
padding:12px;
text-align:center;
font-size:24px;
font-weight:700;
border-top:2px solid #d4af37;
letter-spacing:.5px;
}

@media (max-width:768px){

body{
overflow:auto;
}

.college-top{
flex-direction:column;
gap:10px;
}

.college-text{
text-align:center;
}

.college-text h1{
font-size:32px;
}

.college-text h2{
font-size:15px;
letter-spacing:3px;
}

.notice-card{
padding:20px 16px 28px;
}

.badge{
font-size:20px;
padding:10px 22px;
margin-bottom:14px;
}

#notice-heading{
font-size:30px;
margin-bottom:12px;
}

#notice{
font-size:20px;
line-height:1.7;
padding:18px;
min-height:120px;
}

#date{
font-size:20px;
}

.footer{
flex-direction:column;
gap:8px;
font-size:16px;
text-align:center;
}

.bottom{
font-size:18px;
}
}
</style>
</head>

<body>

<div class="header">
  <div class="college-top">
    <img src="logo.png" alt="College Logo" class="college-logo">

    <div class="college-text">
      <h1>Hazrat Shah Ali Mohila College</h1>
      <h2>DIGITAL NOTICE BOARD</h2>
    </div>
  </div>
</div>

<div class="notice-box">
  <div class="notice-card">

    <div class="badge">📢 NOTICE</div>

    <div id="notice-heading">লোড হচ্ছে...</div>

    <div id="notice"></div>

    <div id="date"></div>

  </div>
</div>

<div class="footer">
  <div>🕒 <span id="clock">--:--:--</span></div>
  <div>Hazrat Shah Ali Mohila College</div>
  <div>📅 <span id="today">--</span></div>
</div>

<div class="bottom">
  শিক্ষাই আলো, শিক্ষাই শক্তি ❤️
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbyM6nadpOV1SDPbpv3wUmifIIQ7AaiCJT4yq3O24mR3OjI1LAiF1exV_1mD6sMA2Vdj/exec';

let notices=[];
let current=0;

function loadNotices(){

const callbackName='showNotices';

window[callbackName]=function(data){

notices=data||[];

if(notices.length===0){

document.getElementById('notice-heading').innerText='নোটিশ নেই';

document.getElementById('notice').innerText='বর্তমানে কোনো নতুন নোটিশ নেই';

document.getElementById('date').innerText='';

return;
}

current=0;

showNotice();
};

const oldScript=document.getElementById('noticeScript');

if(oldScript) oldScript.remove();

const script=document.createElement('script');

script.id='noticeScript';

script.src=API_URL+'?callback='+callbackName+'&t='+Date.now();

document.body.appendChild(script);
}

function showNotice(){

const item=notices[current];

document.getElementById('notice-heading').innerText=item.heading||'';

document.getElementById('notice').innerText=item.notice||'';

const d=new Date(item.date);

document.getElementById('date').innerText=
'📅 তারিখ: '+
d.toLocaleDateString('bn-BD',{
day:'numeric',
month:'long',
year:'numeric'
});
}

setInterval(function(){

if(notices.length>1){

current=(current+1)%notices.length;

showNotice();
}

},10000);

function updateClock(){

const now=new Date();

document.getElementById('clock').innerText=
now.toLocaleTimeString('bn-BD',{hour12:true});

document.getElementById('today').innerText=
now.toLocaleDateString('bn-BD',{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
});
}

setInterval(updateClock,1000);

updateClock();

loadNotices();
</script>

</body>
</html>
